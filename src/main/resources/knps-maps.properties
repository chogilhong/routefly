# 국립공원 공식 지도 바로가기 - 공원 이름 = 국립공원공단 누리집(knps.or.kr)의 지도 주소.
# 앱은 링크만 겁니다(그림을 앱 안에 복사하지 않음 - 공단 지도에는 공공누리 표시가 없어 이용 협의가 필요, docs/knps-maps.md).
# 휴대폰에서 바로 보이게 탐방로 등급지도 JPG 를 씁니다(PDF 는 PC 브라우저에서 내려받기로 넘어갔음 - 2026-10-11) - 안내지도는 12~138MB 라 무거움.
# 태안해안은 등급지도가 없어 안내지도 JPG(12.5MB), 한라산은 제주도 소관이라 저작권 확인 전까지 뺌. 이 파일은 UTF-8 입니다.
