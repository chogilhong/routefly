#side .empty { padding:24px 16px; color:#5b6672; font-size:14px; line-height:1.6; }
.card { margin:12px; background:#fff; border:3px solid transparent; border-radius:14px; overflow:hidden; box-shadow:0 2px 10px rgba(16,24,40,0.08); cursor:pointer; }
