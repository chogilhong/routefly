<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>routefly 별거 별거</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta name="theme-color" content="#11161d">
<!-- 🧰 별거 별거(2026-10-18 홍TV님) - 생활 도구 모음. 우편번호 · 영문 주소(카카오 우편번호 서비스 - 키 없음, 이 쪽만 CSP 로 허용: SecurityFilter.cspFor),
     단위 변환(RF.unitConv - 서버 없이). 찾은 주소는 저장하지 않고 routefly 서버로 보내지 않음. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-icon-180.png">
<link rel="stylesheet" href="css/course-kit.css">
<style>
:root { --bg:#11161d; --panel:#1a212b; --tx:#eef2f7; --dim:#9aa6b4; --ln:rgba(255,255,255,0.12); --sky:#38d9ea; --ok:#4ade80; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--tx); font-family:Arial,"Malgun Gothic",sans-serif; }
#top { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
       background:var(--panel); border-bottom:1px solid var(--ln); }
#top a { flex:0 0 auto; display:inline-flex; align-items:center; height:40px; padding:0 12px; border-radius:20px; text-decoration:none;
         background:rgba(56,217,234,0.16); border:1px solid var(--sky); color:var(--sky); font-size:14px; font-weight:bold; }
#top h1 { flex:1; margin:0; font-size:17px; }
#top .rfTextBtn { flex:0 0 auto; min-width:58px; height:44px; border-radius:22px; font-size:18px; font-weight:bold; }
main { padding:4px 14px calc(env(safe-area-inset-bottom) + 24px); max-width:560px; margin:0 auto; }
section { background:var(--panel); border:1px solid var(--ln); border-radius:14px; padding:12px 14px; margin-top:14px; }
section h2 { margin:0 0 8px; font-size:17px; }
.tip { font-size:13px; color:var(--dim); line-height:1.55; margin:8px 0 0; word-break:keep-all; }
.btn { display:block; width:100%; height:50px; border-radius:12px; border:0; background:var(--sky); color:#062b30; font:bold 16px Arial,"Malgun Gothic",sans-serif; cursor:pointer; }
#pcBox { display:none; height:470px; margin-top:10px; border:1px solid var(--ln); border-radius:10px; overflow:hidden; background:#fff; }
#pcOut { display:none; margin-top:12px; }
.ar { display:flex; gap:8px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--ln); }
.ar:first-child { border-top:0; }
.ar span { flex:0 0 74px; font-size:13px; color:var(--dim); padding-top:2px; }
.ar b { flex:1; font-size:16px; line-height:1.45; overflow-wrap:anywhere; word-break:keep-all; }
.ar button { flex:0 0 auto; height:34px; padding:0 10px; border-radius:8px; border:1px solid var(--ln); background:rgba(255,255,255,0.07); color:var(--tx); font-size:13px; cursor:pointer; }
.cats { display:flex; flex-wrap:wrap; gap:6px; }
.cats button { height:38px; padding:0 12px; border-radius:19px; border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx); font-size:14px; cursor:pointer; }
.cats button.on { background:rgba(56,217,234,0.18); border-color:var(--sky); color:var(--sky); font-weight:bold; }
.uv { display:flex; gap:8px; align-items:center; margin-top:12px; }
.uv input, .uv select { height:50px; border-radius:10px; border:1px solid var(--ln); background:#232b36; color:var(--tx); font-size:18px; padding:0 10px; min-width:0; }
.uv input { flex:1 1 50%; }
.uv select { flex:1 1 50%; }
#uSwap { flex:0 0 auto; width:50px; height:50px; border-radius:25px; border:1px solid var(--sky); background:rgba(56,217,234,0.12); color:var(--sky); font-size:20px; cursor:pointer; }
#uRes { margin-top:12px; font-size:24px; font-weight:bold; overflow-wrap:anywhere; }
#uRes small { font-size:15px; color:var(--dim); font-weight:normal; }
#uOne { font-size:13px; color:var(--dim); margin-top:4px; }
#uAll { list-style:none; margin:12px 0 0; padding:0; font-size:14.5px; }
#uAll li { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--ln); }
#uAll li b { overflow-wrap:anywhere; text-align:right; }
#uAll li span { color:var(--dim); flex:0 0 auto; }
#toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); max-width:90%; background:rgba(0,0,0,0.85);
         color:#fff; padding:10px 16px; border-radius:12px; font-size:15px; display:none; z-index:9; text-align:center; }
</style>
</head>
<body>
<div id="top">
    <a href="m/" id="backLink" data-en="‹ Back">‹ 돌아가기</a>
    <h1 data-en="🧰 Handy tools">🧰 별거 별거</h1>
</div>
<main>
    <section>
        <h2 data-en="📮 Postcode · English address">📮 우편번호 · 영문 주소</h2>
        <button type="button" class="btn" id="pcBtn" data-en="🔍 Find an address">🔍 주소 찾기</button>
        <div id="pcBox"></div>
        <div id="pcOut"></div>
        <p class="tip" data-en="Type a road name and building number (e.g. 잠실로 51-33) or a neighborhood and lot number (e.g. 역삼동 737) - the search box is in Korean. You get the postcode, road and lot addresses, and the English address. Search uses the Kakao postcode service; routefly does not save the address or send it to its server.">도로명 + 건물번호(예: 잠실로 51-33)나 동 · 읍 · 면 + 번지(예: 역삼동 737)로 찾으면 우편번호 · 도로명 · 지번 · 영문 주소가 나옵니다. 찾기는 카카오 우편번호 서비스로 하고, routefly 는 주소를 저장하거나 서버로 보내지 않습니다.</p>
    </section>

    <section>
        <h2 data-en="📏 Unit converter">📏 단위 변환</h2>
        <div class="cats" id="uCats"></div>
        <div class="uv">
            <input type="text" id="uVal" inputmode="decimal" value="1" aria-label="값" data-en-aria-label="Value">
            <select id="uFrom" aria-label="바꿀 단위" data-en-aria-label="From unit"></select>
        </div>
        <div class="uv">
            <button type="button" id="uSwap" title="단위 바꾸기" data-en-title="Swap units" aria-label="단위 바꾸기" data-en-aria-label="Swap units">⇅</button>
            <select id="uTo" aria-label="결과 단위" data-en-aria-label="To unit"></select>
        </div>
        <div id="uRes"></div>
        <div id="uOne"></div>
        <ul id="uAll"></ul>
        <p class="tip" data-en="1 pyeong = 3.3058 ㎡ · 1 geun = 600 g (meat; vegetables 375 g) · 1 cup = 200 mL (Korean cooking) · 1 KB = 1,024 B.">1평 = 3.3058㎡ · 1근 = 600g(고기 - 채소는 375g) · 1컵 = 200mL(한국 요리 계량) · 1KB = 1,024B 로 셉니다.</p>
    </section>
</main>
<div id="toast"></div>
<script src="js/course-kit.js"></script>
<script src="js/tools.js"></script>
<script src="js/sw-reg.js"></script>
</body>
</html>
