<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="js/root-go.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>routefly 코스 미리보기</title>
<link rel="canonical" href="https://routefly.kr/routefly/">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta name="theme-color" content="#15324f">
<!-- 경로를 3D 지형 위에서 따라가며 보여 주는 화면.
     자료: /api/courses (목록) · /api/course?id= (한 코스) · /api/map-config (지도 키) - routefly-batch 가 넣은 표를 읽기만 합니다.
     지도: MapLibre GL JS 5.24.0 (vendor 폴더, BSD-3) - CDN 없이 이 앱이 직접 내려줍니다. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-icon-180.png">
<meta property="og:title" content="routefly - 3D로 미리 날아 보는 등산 · 걷기 · 자전거 코스">
<meta property="og:description" content="코스를 3D 지형 위에서 미리 보고, 핸드폰으로 따라 걷기">
<meta property="og:image" content="img/og.png?v=2">
<link rel="stylesheet" href="vendor/maplibre-gl-5.24.0/maplibre-gl.css">
<link rel="stylesheet" href="css/course-kit.css">
<style>
:root {
    --panel:rgba(18,24,33,0.86); --tx:#eef2f7; --dim:#a9b4c2; --faint:#7d8896; --ln:rgba(255,255,255,0.14);
    --route:#ffb703; --brand:#4da3ff;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#0f141b; color:var(--tx); font-family:Arial,"Malgun Gothic",sans-serif; overflow:hidden; }
#map { position:absolute; inset:0; }

.panel { position:absolute; background:var(--panel); border:1px solid var(--ln); border-radius:12px;
         -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }

/* 왼쪽 위: 코스 목록 */
#side { top:12px; left:12px; width:300px; max-height:calc(100% - 200px); display:flex; flex-direction:column; z-index:2; }
#side header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--ln); }
#side h1 { margin:0; font-size:17px; letter-spacing:0.3px; }
#side h1 span { color:var(--route); }
#side h1 { white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
#side h1 small { font-size:14px; font-weight:bold; color:var(--tx); margin-left:5px; letter-spacing:-0.2px; }
/* 공원 전체(park.html)의 '‹ 코스' 와 같은 모양(2026-10-11 홍TV님) - 둥근 하늘색 테두리 */
#back { margin-left:auto; display:inline-flex; align-items:center; height:40px; padding:0 12px; border-radius:20px;
        background:rgba(56,217,234,0.16); border:1px solid #38d9ea; color:#38d9ea; font-size:14px; font-weight:bold; cursor:pointer; white-space:nowrap; }
.tools { display:flex; gap:4px; margin-top:6px; }
.tools button { flex:1 1 auto; min-width:0; height:36px;   /* 2026-10-09 점검: 손가락으로 누르기 쉽게(28 → 36px) */
                border-radius:7px; border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx);
                font-size:11.5px; letter-spacing:-0.3px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 2px; }
.tools a { flex:1 1 auto; min-width:0; height:36px; box-sizing:border-box; border-radius:7px; border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx);
            font-size:11.5px; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; padding:0 2px; display:flex; align-items:center; justify-content:center; text-decoration:none; }   /* 🏅 도장(series.html - 도장 · 완주). 두 화면 모두 한 줄에 단추 넷이라 짧은 이름으로 맞춤(2026-10-12) */
#list { overflow-y:auto; padding:4px 0; }
#side.closed #list, #side.closed .search, #side.closed .foot { display:none; }
.foot { flex:0 0 auto; padding:6px 12px 8px; border-top:1px solid var(--ln); font-size:12px; color:var(--dim); }   /* 2026-10-11 개인정보처리방침 */
.foot a { color:var(--dim); }
.search { padding:8px 12px 6px; border-bottom:1px solid var(--ln); }
.search input { width:100%; padding:7px 10px; border-radius:7px; border:1px solid var(--ln); background:rgba(255,255,255,0.08);
                color:var(--tx); font-size:16px; outline:none; }   /* 2026-10-10 점검: 16px 보다 작으면 아이폰이 누를 때 화면을 확대합니다 */
.search input:focus { border-color:var(--route); }
.kinds { display:flex; gap:5px; margin-top:7px; }
.kinds button { flex:1; height:40px; border-radius:20px; border:1px solid var(--ln); background:rgba(255,255,255,0.05); color:var(--dim);
                font-size:12px; cursor:pointer; padding:0; white-space:nowrap; }
.kinds button.on { background:var(--route); border-color:var(--route); color:#1b1b1b; font-weight:bold; }
.count { padding:7px 12px 3px; font-size:11.5px; color:var(--faint); line-height:1.4; }
#side.closed header { border-bottom:0; }
.course { padding:9px 12px; cursor:pointer; border-left:3px solid transparent; }
.course:hover { background:rgba(255,255,255,0.05); }
.course.on { border-left-color:var(--route); background:rgba(255,183,3,0.10); }
.course .nm { font-size:14px; font-weight:bold; }
.course .st { margin-top:2px; font-size:12px; color:var(--dim); }
.empty { padding:14px 12px; font-size:13px; color:var(--dim); line-height:1.5; }

/* 오른쪽 위: 진행 거리 · 고도 */
#hud { top:12px; right:56px; padding:8px 12px; text-align:right; z-index:2; display:none; }   /* 오른쪽 끝은 확대 버튼 자리 */
#hud .km { font-size:24px; font-weight:bold; font-variant-numeric:tabular-nums; }
#hud .km small { font-size:13px; font-weight:normal; color:var(--dim); margin-left:2px; }
#hud .ele { font-size:12.5px; color:var(--dim); margin-top:1px; font-variant-numeric:tabular-nums; }

/* 오른쪽: 작은 평면 지도(북쪽이 위, km 번호 · 지금 위치) */
#mini { top:142px; right:12px; width:160px; height:160px; padding:4px; z-index:2; display:none; }

/* 아래: 고도 그래프 + 조작 */
#bottom { left:12px; right:12px; bottom:14px; padding:10px 12px 8px; z-index:2; display:none; }
#title { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
#title b { font-size:15px; }
#title .rfFavBtn { background:none; border:0; color:var(--dim); font-size:20px; line-height:1; padding:0 2px; margin-left:-6px; cursor:pointer; align-self:center; }
#title .rfFavBtn.on { color:#ffd43b; }
#title .rfFavBtn[hidden] { display:none; }
#title span { font-size:12.5px; color:var(--dim); }
#controls { display:flex; gap:6px; margin-left:auto; }
#controls button { border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx); border-radius:6px;
                   padding:5px 10px; font-size:13px; cursor:pointer; min-width:38px; white-space:nowrap; }
#controls a.btn { border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx); border-radius:6px;
                  padding:5px 10px; font-size:13px; text-decoration:none; white-space:nowrap; }
#controls button.main { background:var(--route); border-color:var(--route); color:#1b1b1b; font-weight:bold; min-width:74px; }
#profile { position:relative; margin-top:6px; height:96px; cursor:pointer; }
#guideBar { display:none; gap:6px; margin-top:7px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
#guideBar::-webkit-scrollbar { display:none; }
#guideBar button { flex:0 0 auto; min-height:36px; padding:0 11px; border-radius:18px; border:1px solid var(--ln); background:rgba(255,255,255,0.06);
                   color:var(--tx); font-size:12.5px; white-space:nowrap; cursor:pointer; }
#guideBar button.on { border-color:var(--route); color:var(--route); }
#guideSheet { left:12px; right:12px; bottom:14px; max-height:62%; z-index:4; display:none; flex-direction:column; max-width:560px; }
#guideSheet.open { display:flex; }
#guideSheet header { display:flex; align-items:center; gap:8px; padding:8px 8px 8px 14px; border-bottom:1px solid var(--ln); }
#guideSheet h2 { margin:0; font-size:15px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#guideClose { width:40px; height:40px; border-radius:20px; border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx); font-size:15px; cursor:pointer; }
#guideBody { overflow-y:auto; padding:4px 14px 12px; font-size:13.5px; line-height:1.5; }
#guideBody .gRow { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--ln); }
#guideBody .gRow.tap { cursor:pointer; }
#guideBody .gRow .gMain { flex:1; min-width:0; }
#guideBody .gRow small { display:block; color:var(--dim); font-size:12px; }
#guideBody .gRow .gSide { flex:none; text-align:right; color:var(--dim); font-size:12.5px; white-space:nowrap; }
#guideBody .gDay { margin-top:10px; font-weight:bold; color:var(--route); font-size:13px; }
#guideBody .gDay small { display:block; font-weight:normal; color:var(--dim); font-size:12px; }   /* 미세먼지 예보(2026-10-15) */
#guideBody .gLinks { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
#guideBody .gLinks a { display:inline-flex; align-items:center; min-height:34px; padding:0 10px; border-radius:8px; border:1px solid var(--ln);
                        background:rgba(255,255,255,0.06); color:var(--tx); text-decoration:none; font-size:12.5px; }
#guideBody .gPetToggle { display:inline-flex; align-items:center; min-height:34px; margin:6px 0 2px; padding:0 10px; border-radius:17px; border:1px solid #4ade80;
                          color:#b8f0c8; background:rgba(74,222,128,0.08); text-decoration:none; font-size:12.5px; }
#guideBody .gPet { margin-top:6px; padding:6px 8px; border-radius:8px; background:rgba(255,255,255,0.05); font-size:12.5px; color:var(--dim); line-height:1.45; }
#guideBody .gNote { margin-top:10px; font-size:11.5px; color:var(--faint); }
#guideBody .gWarn { color:#ffb3b3; }
#guideBody .gNote a { color:#38d9ea; font-weight:600; text-decoration:underline; text-underline-offset:2px; }   /* "예약 안내 ›" 가 어두운 바탕에서 잘 안 보였음(2026-10-14) */
.spotMark { width:46px; height:46px; pointer-events:none; }
.spotRing { width:46px; height:46px; border-radius:50%; border:3px solid var(--route); box-shadow:0 0 0 3px rgba(0,0,0,0.45), 0 0 14px rgba(255,183,3,0.8);
            pointer-events:none; animation:spotPulse 1.2s ease-in-out infinite; }
@keyframes spotPulse { 0%, 100% { transform:scale(0.85); opacity:1; } 50% { transform:scale(1.15); opacity:0.7; } }
#guideBody input[type=time] { font-size:16px; padding:4px 8px; border-radius:7px; border:1px solid var(--ln); background:rgba(255,255,255,0.08); color:var(--tx); }

/* 지도 위 이름표 - 아이콘 + 흰 글씨(상자 없이). 아이콘 자리가 그 지점입니다. */
.poi { pointer-events:none; opacity:0; transform:translateY(6px); transition:opacity .45s, transform .45s;
       display:flex; flex-direction:column; align-items:center; }
.poi.on, .poi.always { opacity:1; transform:none; }
.poi .lb { color:#fff; padding:0 2px 2px; font-size:13.5px; font-weight:bold; white-space:nowrap; letter-spacing:0.2px;
           text-shadow:0 0 3px #000, 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.6); text-align:center; line-height:1.25; }
.poi .lb small { display:block; font-size:10.5px; font-weight:normal; color:#e9eef4; margin:0; }
.poi .lb .more { display:block; font-size:12px; font-weight:bold; color:#f1f4f7; }
.poi.hid { opacity:0 !important; }   /* 화면에서 다른 이름표와 포개질 때(지도가 움직이면 다시 판단) */
.poi .ic { width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,0.92); display:flex; align-items:center;
           justify-content:center; font-size:15px; line-height:1; box-shadow:0 1px 4px rgba(0,0,0,0.55); }

/* 현재 위치 - 흰 테두리 동그란 배지 */
.head-badge { width:32px; height:32px; border-radius:50%; background:#1f8fa0; border:3px solid #fff;
              box-shadow:0 0 0 2px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center;
              pointer-events:none; z-index:1; }

/* 비행 중 큰 자막(화면 가운데) */
#caption { position:absolute; left:50%; top:56%; transform:translate(-50%, 8px); z-index:3; pointer-events:none;
           text-align:center; opacity:0; transition:opacity .5s, transform .5s; max-width:calc(100% - 32px); }
#caption.on { opacity:1; transform:translate(-50%, 0); }
#caption .t { color:#fff; font-size:clamp(24px, 3.4vw, 40px); font-weight:900; letter-spacing:0.5px; line-height:1.2;
              -webkit-text-stroke:1px rgba(0,0,0,0.85);
              text-shadow:0 2px 0 #000, 0 0 6px rgba(0,0,0,0.9), 0 0 18px rgba(0,0,0,0.6); }
#caption .s { margin-top:6px; color:#f1f5f9; font-size:clamp(14px, 1.6vw, 19px); font-weight:bold;
              text-shadow:0 1px 2px #000, 0 0 6px rgba(0,0,0,0.85); }

/* 비행 중에는 목록을 숨겨 지도를 꽉 차게 */
#side { transition:opacity .4s; }
body.flying #side { opacity:0; pointer-events:none; }

#msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:14px 18px; font-size:14px; color:var(--dim);
       z-index:3; display:none; max-width:min(420px, calc(100% - 32px)); text-align:center; line-height:1.5; }

@media (max-width:640px) {
    #side h1 small { display:block; margin:2px 0 0; line-height:1.1; }   /* 좁은 화면 - '코스 미리보기' 를 routefly 아래 줄에(잘리지 않게) */
    #side h1 { line-height:1.1; }
    /* 오른쪽은 확대 버튼 자리. 목록이 한두 줄만 보이던 것(자판이 올라오면 화면이 줄어 더 적음) - 거의 화면 끝까지(2026-10-09 홍TV님).
       코스를 고르면 목록이 저절로 접히므로 지도는 그때 넓게 보입니다. */
    #side { width:auto; right:60px; max-height:calc(100% - 24px); }
    #hud { top:auto; right:12px; bottom:170px; }        /* 실제 높이는 app.js 가 아래 판 높이에 맞춰 다시 정합니다 */
    #title span.opt { display:none; }
    #profile { height:78px; margin-top:16px; }
    /* 좁은 화면: 비스듬한 이름이 위 버튼 줄까지 올라가 겹쳐 다 숨겼더니 들머리 · 정상 · 날머리도 안 보였음(2026-10-10 홍TV님) -
       출발 · 도착 · 정상(key)만 남기고, 버튼 줄과 사이를 띄움 */
    #profile .rf-plabel:not(.key) { display:none; }
    #bottom { left:8px; right:8px; bottom:8px; padding:8px 8px 6px; }
    #guideSheet { left:8px; right:8px; max-width:none; }
    body.listopen #bottom, body.listopen #hud { display:none !important; }   /* 목록을 펼친 동안은 아래 판을 숨김(겹치던 것) */
    #title b { font-size:14px; }
    #controls { width:100%; margin-left:0; gap:4px; }   /* 버튼은 이름 아래 한 줄로, 똑같이 나눠 */
    #controls button, #controls a.btn { flex:1 1 0; min-width:0; padding:7px 2px; font-size:12.5px; text-align:center;
                                        white-space:nowrap; overflow:hidden; min-height:40px; }   /* 2026-10-10 점검: 누르기 쉽게 */
    #controls a.btn { display:flex; align-items:center; justify-content:center; }
    #controls button.main { min-width:0; flex-grow:1.3; }
    #controls #speed { flex-grow:0.8; }
    #caption { top:46%; }
    #mini { top:12px; right:60px; width:104px; height:104px; }
    .maplibregl-ctrl-top-right { z-index:3; }   /* 출처 상자(OSM 등)가 목록 창 뒤로 가려지지 않게 */
    body:not(.flying) #mini { visibility:hidden; }   /* 좁은 화면에서는 비행 중에만(목록 자리) */
}
</style>
</head>
<body>
<div id="map"></div>

<div id="side" class="panel">
    <header>
        <h1 data-en="route&lt;span&gt;fly&lt;/span&gt;&lt;small&gt;3D trail preview&lt;/small&gt;">route<span>fly</span><small>코스 미리보기</small></h1>
        <button type="button" id="back" title="첫 화면(따라가기 코스 목록)으로" data-en="‹ List" data-en-title="Back to the first screen (Follow trail list)">‹ 목록</button>
    </header>
    <div class="search"><input type="search" id="q" aria-label="코스 · 산 이름으로 찾기" placeholder="코스 · 산 이름 (예: 설악산, 둘레길, 국토종주)" autocomplete="off" maxlength="50" data-en-aria-label="Search by trail or mountain name" data-en-placeholder="Mountain or trail (e.g. Seoraksan, Jirisan)">
        <div class="kinds" id="kindTabs" role="group" aria-label="코스 종류" data-en-aria-label="Trail type">
            <button type="button" data-kind="" class="on" aria-pressed="true" data-en="All">전체</button>
            <button type="button" data-kind="hike" aria-pressed="false" data-en="⛰️ Hiking">⛰️ 등산</button>
            <button type="button" data-kind="walk" aria-pressed="false" data-en="🚶 Walking">🚶 걷기</button>
            <button type="button" data-kind="bike" aria-pressed="false" data-en="🚴 Cycling">🚴 자전거</button>
        </div>
        <div class="tools">
            <button type="button" id="nearMe" title="내 위치 둘레 코스(지도를 내 위치로)" data-en="📍 Near me" data-en-title="Trails around you (moves the map to your location)">📍 내 주변 코스</button>
            <button type="button" id="myRecords" title="따라가기 화면의 내 기록" data-en="📒 My records" data-en-title="My records on the Follow screen">📒 내 기록</button>
            <a href="series.html" title="도장 · 완주 - 국토종주 인증센터 도장, 숲길 · 둘레길 코스 완주 모아 보기" data-en="🏅 Stamps" data-en-title="Stamps · completions - bike path checkpoints, forest and dulle trail completions">🏅 도장</a>
            <button type="button" id="gpxOpen" title="다른 앱 · 친구가 보내 준 GPX 파일을 미리 날아 봅니다" data-en="📂 Open GPX" data-en-title="Open a GPX file from another app or a friend and fly it">📂 GPX 열기</button>
            <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" hidden>
        </div></div>
    <div id="list"><div class="empty" data-en="Loading trails…">코스를 불러오는 중…</div></div>
    <div class="foot" data-en="&lt;a href=&quot;about.html&quot;&gt;About · sources (Korean)&lt;/a&gt; · &lt;a href=&quot;privacy.html&quot;&gt;Privacy (Korean)&lt;/a&gt; · &lt;a href=&quot;lbs-terms.html&quot;&gt;Location terms (Korean)&lt;/a&gt;"><a href="about.html">안내 · 출처</a> · <a href="privacy.html">개인정보처리방침</a> · <a href="lbs-terms.html">위치기반서비스 이용약관</a></div>
</div>

<div id="hud" class="panel">
    <div class="km"><span id="hudKm">0.00</span><small>km</small></div>
    <div class="ele" id="hudEle" data-en="elev. -">고도 -</div>
    <div class="ele" id="hudGrade"></div>
</div>

<div id="bottom" class="panel">
    <div id="title">
        <b id="courseName">-</b>
        <span id="courseStat"></span>
