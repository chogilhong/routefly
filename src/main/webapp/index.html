<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>routefly</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<meta name="theme-color" content="#15324f">
<!-- 경로를 3D 지형 위에서 따라가며 보여 주는 화면.
     자료: /api/courses (목록) · /api/course?id= (한 코스) · /api/map-config (지도 키) - routefly-batch 가 넣은 표를 읽기만 합니다.
     지도: MapLibre GL JS 5.24.0 (vendor 폴더, BSD-3) - CDN 없이 이 앱이 직접 내려줍니다. -->
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="routefly - 3D로 미리 날아 보는 등산 · 걷기 · 자전거 코스">
<meta property="og:description" content="코스를 3D 지형 위에서 미리 보고, 핸드폰으로 따라 걷기">
<meta property="og:image" content="img/og.png">
<link rel="stylesheet" href="vendor/maplibre-gl-5.24.0/maplibre-gl.css">
<link rel="stylesheet" href="css/course-kit.css">
<style>
:root {
    --panel:rgba(18,24,33,0.86); --tx:#eef2f7; --dim:#a9b4c2; --faint:#7d8896; --ln:rgba(255,255,255,0.14);
    --route:#ffb703; --brand:#4da3ff;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#0f141b; color:var(--tx); font-family:Arial,"Malgun Gothic",sans-serif; overflow:hidden; }
#map { position:absolute; inset:0; }

.panel { position:absolute; background:var(--panel); border:1px solid var(--ln); border-radius:12px;
         -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }

/* 왼쪽 위: 코스 목록 */
#side { top:12px; left:12px; width:300px; max-height:calc(100% - 200px); display:flex; flex-direction:column; z-index:2; }
#side header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--ln); }
#side h1 { margin:0; font-size:17px; letter-spacing:0.3px; }
#side h1 span { color:var(--route); }
#toggle { margin-left:auto; border:1px solid var(--ln); background:transparent; color:var(--dim); border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer; }
#list { overflow-y:auto; padding:4px 0; }
#side.closed #list, #side.closed .search { display:none; }
.search { padding:8px 12px 6px; border-bottom:1px solid var(--ln); }
.search input { width:100%; padding:7px 10px; border-radius:7px; border:1px solid var(--ln); background:rgba(255,255,255,0.08);
                color:var(--tx); font-size:13.5px; outline:none; }
.search input:focus { border-color:var(--route); }
.kinds { display:flex; gap:5px; margin-top:7px; }
.kinds button { flex:1; height:26px; border-radius:13px; border:1px solid var(--ln); background:rgba(255,255,255,0.05); color:var(--dim);
                font-size:12px; cursor:pointer; padding:0; white-space:nowrap; }
.kinds button.on { background:var(--route); border-color:var(--route); color:#1b1b1b; font-weight:bold; }
.count { padding:7px 12px 3px; font-size:11.5px; color:var(--faint); line-height:1.4; }
#side.closed header { border-bottom:0; }
.course { padding:9px 12px; cursor:pointer; border-left:3px solid transparent; }
.course:hover { background:rgba(255,255,255,0.05); }
.course.on { border-left-color:var(--route); background:rgba(255,183,3,0.10); }
.course .nm { font-size:14px; font-weight:bold; }
.course .st { margin-top:2px; font-size:12px; color:var(--dim); }
.empty { padding:14px 12px; font-size:13px; color:var(--dim); line-height:1.5; }

/* 오른쪽 위: 진행 거리 · 고도 */
#hud { top:12px; right:56px; padding:8px 12px; text-align:right; z-index:2; display:none; }   /* 오른쪽 끝은 확대 버튼 자리 */
#hud .km { font-size:24px; font-weight:bold; font-variant-numeric:tabular-nums; }
#hud .km small { font-size:13px; font-weight:normal; color:var(--dim); margin-left:2px; }
#hud .ele { font-size:12.5px; color:var(--dim); margin-top:1px; font-variant-numeric:tabular-nums; }

/* 오른쪽: 작은 평면 지도(북쪽이 위, km 번호 · 지금 위치) */
#mini { top:142px; right:12px; width:160px; height:160px; padding:4px; z-index:2; display:none; }

/* 아래: 고도 그래프 + 조작 */
#bottom { left:12px; right:12px; bottom:14px; padding:10px 12px 8px; z-index:2; display:none; }
#title { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
#title b { font-size:15px; }
#title span { font-size:12.5px; color:var(--dim); }
#controls { display:flex; gap:6px; margin-left:auto; }
#controls button { border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx); border-radius:6px;
                   padding:5px 10px; font-size:13px; cursor:pointer; min-width:38px; }
#controls a.btn { border:1px solid var(--ln); background:rgba(255,255,255,0.06); color:var(--tx); border-radius:6px;
                  padding:5px 10px; font-size:13px; text-decoration:none; white-space:nowrap; }
#controls button.main { background:var(--route); border-color:var(--route); color:#1b1b1b; font-weight:bold; min-width:74px; }
#profile { position:relative; margin-top:6px; height:96px; cursor:pointer; }

/* 지도 위 이름표 - 아이콘 + 흰 글씨(상자 없이). 아이콘 자리가 그 지점입니다. */
.poi { pointer-events:none; opacity:0; transform:translateY(6px); transition:opacity .45s, transform .45s;
       display:flex; flex-direction:column; align-items:center; }
.poi.on, .poi.always { opacity:1; transform:none; }
.poi .lb { color:#fff; padding:0 2px 2px; font-size:13.5px; font-weight:bold; white-space:nowrap; letter-spacing:0.2px;
           text-shadow:0 0 3px #000, 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.6); text-align:center; line-height:1.25; }
.poi .lb small { display:block; font-size:10.5px; font-weight:normal; color:#e9eef4; margin:0; }
.poi .lb .more { display:block; font-size:12px; font-weight:bold; color:#f1f4f7; }
.poi.hid { opacity:0 !important; }   /* 화면에서 다른 이름표와 포개질 때(지도가 움직이면 다시 판단) */
.poi .ic { width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,0.92); display:flex; align-items:center;
           justify-content:center; font-size:15px; line-height:1; box-shadow:0 1px 4px rgba(0,0,0,0.55); }

/* 현재 위치 - 흰 테두리 동그란 배지 */
.head-badge { width:32px; height:32px; border-radius:50%; background:#1f8fa0; border:3px solid #fff;
              box-shadow:0 0 0 2px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center;
              pointer-events:none; z-index:1; }

/* 비행 중 큰 자막(화면 가운데) */
#caption { position:absolute; left:50%; top:56%; transform:translate(-50%, 8px); z-index:3; pointer-events:none;
           text-align:center; opacity:0; transition:opacity .5s, transform .5s; max-width:calc(100% - 32px); }
#caption.on { opacity:1; transform:translate(-50%, 0); }
#caption .t { color:#fff; font-size:clamp(24px, 3.4vw, 40px); font-weight:900; letter-spacing:0.5px; line-height:1.2;
              -webkit-text-stroke:1px rgba(0,0,0,0.85);
              text-shadow:0 2px 0 #000, 0 0 6px rgba(0,0,0,0.9), 0 0 18px rgba(0,0,0,0.6); }
#caption .s { margin-top:6px; color:#f1f5f9; font-size:clamp(14px, 1.6vw, 19px); font-weight:bold;
              text-shadow:0 1px 2px #000, 0 0 6px rgba(0,0,0,0.85); }

/* 비행 중에는 목록을 숨겨 지도를 꽉 차게 */
#side { transition:opacity .4s; }
body.flying #side { opacity:0; pointer-events:none; }

#msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:14px 18px; font-size:14px; color:var(--dim);
       z-index:3; display:none; max-width:min(420px, calc(100% - 32px)); text-align:center; line-height:1.5; }

@media (max-width:640px) {
    #side { width:auto; right:60px; max-height:40%; }   /* 오른쪽은 확대 버튼 자리 */
    #hud { top:auto; right:12px; bottom:170px; }        /* 실제 높이는 app.js 가 아래 판 높이에 맞춰 다시 정합니다 */
    #title span.opt { display:none; }
    #profile { height:70px; }
    #profile .rf-plabel { display:none; }   /* 비스듬한 이름이 위 버튼 줄까지 올라가 겹침 - 이름은 지도에 나옵니다(점은 남김) */
    #bottom { left:8px; right:8px; bottom:8px; padding:8px 8px 6px; }
    #title b { font-size:14px; }
    #controls { width:100%; margin-left:0; gap:4px; }   /* 버튼은 이름 아래 한 줄로, 똑같이 나눠 */
    #controls button, #controls a.btn { flex:1 1 0; min-width:0; padding:7px 2px; font-size:12.5px; text-align:center;
                                        white-space:nowrap; overflow:hidden; }
    #controls button.main { min-width:0; flex-grow:1.3; }
    #controls #hikeLink { flex-grow:1.4; }
    #controls #speed { flex-grow:0.8; }
    #caption { top:46%; }
    #mini { top:12px; right:60px; width:104px; height:104px; }
    body:not(.flying) #mini { visibility:hidden; }   /* 좁은 화면에서는 비행 중에만(목록 자리) */
}
</style>
</head>
<body>
<div id="map"></div>

<div id="side" class="panel">
    <header>
        <h1>route<span>fly</span></h1>
        <button type="button" id="toggle">접기</button>
    </header>
    <div class="search"><input type="search" id="q" placeholder="코스 · 산 이름 검색 (예: 설악산, 공룡)" autocomplete="off" maxlength="50">
        <div class="kinds" id="kindTabs">
            <button type="button" data-kind="" class="on">전체</button>
            <button type="button" data-kind="hike">⛰️ 등산</button>
            <button type="button" data-kind="walk">🚶 걷기</button>
            <button type="button" data-kind="bike">🚴 자전거</button>
        </div></div>
    <div id="list"><div class="empty">코스를 불러오는 중…</div></div>
</div>

<div id="hud" class="panel">
    <div class="km"><span id="hudKm">0.00</span><small>km</small></div>
    <div class="ele" id="hudEle">고도 -</div>
    <div class="ele" id="hudGrade"></div>
</div>

<div id="bottom" class="panel">
    <div id="title">
        <b id="courseName">-</b>
        <span id="courseStat"></span>
        <div id="controls">
            <button type="button" id="play" class="main">▶ 비행</button>
            <button type="button" id="speed" title="빠르기">0.25×</button>
            <button type="button" id="overview" title="코스 전체 보기">전체</button>
            <a id="hikeLink" class="btn" href="hike.html" title="핸드폰으로 이 코스를 따라가는 화면(GPS)">📱 따라가기</a>
            <button type="button" id="shareBtn" title="이 코스 링크 보내기" style="display:none">공유</button>
        </div>
    </div>
    <div id="profile"></div>
</div>

<div id="mini" class="panel" title="코스 평면도(북쪽이 위)"></div>

<div id="caption" aria-live="polite"></div>

<div id="msg" class="panel"></div>

<script src="vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
<script src="js/course-kit.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
