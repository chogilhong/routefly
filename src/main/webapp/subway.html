<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>routefly 지하철 노선도</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta name="theme-color" content="#11161d">
<!-- 🚇 지하철 노선도(2026-10-18 홍TV님) - 노선도 그림은 저작권이 있어 넣지 않고, 지도 서비스의 노선도로 연결만(API 키 없음). 주소는 js/subway.js -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-icon-180.png">
<link rel="stylesheet" href="css/course-kit.css">
<style>
:root { --bg:#11161d; --panel:#1a212b; --tx:#eef2f7; --dim:#9aa6b4; --ln:rgba(255,255,255,0.12); --sky:#38d9ea; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--tx); font-family:Arial,"Malgun Gothic",sans-serif; }
#top { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; background:var(--panel); border-bottom:1px solid var(--ln); }
#top a { flex:0 0 auto; display:inline-flex; align-items:center; height:40px; padding:0 12px; border-radius:20px; text-decoration:none; background:rgba(56,217,234,0.16); border:1px solid var(--sky); color:var(--sky); font-size:14px; font-weight:bold; }
#top h1 { flex:1; margin:0; font-size:17px; }
#top .rfTextBtn { flex:0 0 auto; min-width:58px; height:44px; border-radius:22px; font-size:18px; font-weight:bold; }
main { padding:8px 14px calc(env(safe-area-inset-bottom) + 24px); max-width:560px; margin:0 auto; }
.reg { background:var(--panel); border:1px solid var(--ln); border-radius:14px; padding:12px 14px; margin-top:12px; }
.reg h2 { margin:0 0 10px; font-size:18px; }
.reg h2 small { font-size:13px; font-weight:normal; color:var(--dim); }
.reg .links { display:flex; gap:8px; flex-wrap:wrap; }
.reg .links a { flex:1 1 140px; display:flex; align-items:center; justify-content:center; min-height:50px; border-radius:12px; text-decoration:none; font:bold 16px Arial,"Malgun Gothic",sans-serif; border:1px solid var(--sky); background:rgba(56,217,234,0.12); color:var(--sky); }
.tip { font-size:13px; color:var(--dim); line-height:1.55; margin:14px 2px 0; word-break:keep-all; }
</style>
</head>
<body>
<div id="top">
    <a href="m/" id="backLink" data-en="‹ Back">‹ 돌아가기</a>
    <h1 data-en="🚇 Subway maps">🚇 지하철 노선도</h1>
</div>
<main>
    <div id="regions"></div>
    <p class="tip" data-en="Opens the subway map of a map service (routes, transfers, timetables). The official map images are copyrighted, so routefly links to them instead of copying them.">지도 서비스의 지하철 노선도(길찾기 · 환승 · 시간표)를 엽니다. 공식 노선도 그림은 저작권이 있어 routefly 에 넣지 않고 연결만 합니다.</p>
</main>
<script src="js/course-kit.js"></script>
<script src="js/subway.js"></script>
<script src="js/sw-reg.js"></script>
</body>
</html>
