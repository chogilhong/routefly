<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>routefly 의견 보내기</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta name="theme-color" content="#11161d">
<style>
:focus-visible { outline: 2px solid #4dabf7; outline-offset: 2px; }
:root { --bg:#11161d; --panel:#1a212b; --tx:#e9eef4; --dim:#9aa6b4; --ln:rgba(255,255,255,0.12); --sky:#38d9ea; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; background:var(--bg); color:var(--tx); font-family:Arial,"Malgun Gothic",sans-serif; line-height:1.6; }
main { max-width:640px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px); }
h1 { font-size:21px; margin:0 0 6px; }
.lead { color:var(--dim); font-size:14px; margin:0 0 16px; }
section { background:var(--panel); border:1px solid var(--ln); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
label { display:block; font-size:14px; margin:10px 0 4px; color:var(--dim); }
textarea, input { width:100%; font:16px Arial,"Malgun Gothic",sans-serif; color:var(--tx); background:#0e1319; border:1px solid var(--ln); border-radius:8px; padding:10px; }
textarea { min-height:160px; resize:vertical; }
button { width:100%; min-height:48px; margin-top:14px; border:0; border-radius:10px; background:var(--sky); color:#062026; font:bold 16px Arial,"Malgun Gothic",sans-serif; cursor:pointer; }
button:disabled { opacity:0.5; }
.dim { color:var(--dim); font-size:13px; }
.count { text-align:right; }
#msg { margin-top:10px; font-size:14.5px; }
#msg.ok { color:#8ce99a; }
a { color:var(--sky); }
</style>
</head>
<body>
<main>
    <h1>📮 의견 보내기</h1>
    <p class="lead">고칠 곳, 틀린 자료, 바라는 기능을 적어 주세요. 운영자에게 메일로 바로 갑니다.</p>
    <section id="form">
        <label for="fbText">내용</label>
        <textarea id="fbText" maxlength="1000" placeholder="예: 북한산 백운대 코스 들머리 주차장 위치가 달라요."></textarea>
        <div class="dim count"><span id="fbCount">0</span> / 1000</div>
        <label for="fbReply">답장 받을 메일 (선택)</label>
        <input id="fbReply" type="email" maxlength="80" autocomplete="email" placeholder="비워 두면 답장 없이 받기만 합니다">
        <p class="dim">위치 · 기기 정보는 함께 보내지 않습니다. 어느 화면에서 왔는지(주소 경로)만 붙습니다.
            적은 글과 메일 주소는 답장 · 서비스 고치기에만 쓰고 1년 뒤 지웁니다. <a href="privacy.html#feedback">자세히</a></p>
        <button id="fbSend">보내기</button>
        <div id="msg" role="status"></div>
    </section>
    <p><a href="#" id="fbBack">‹ 돌아가기</a></p>
</main>
<script src="js/feedback.js"></script>
<script src="js/seen.js"></script>
</body>
</html>
